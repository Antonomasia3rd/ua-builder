name: Build Unlegacy-Android 6.0 (Galaxy Tab 2)

# Manual only: Actions tab -> "Build Unlegacy-Android 6.0 (Galaxy Tab 2)" -> Run workflow.
# Needs a PUBLIC repository: only public repos get the 4 vCPU / 16 GB runner; private ones get 2 vCPU / 8 GB,
# which will not finish inside GitHub's 6-hour job limit (see UA-ACTIONS-README.md).
# History:
#  run #1: synced, built the image, compiled ~1 h, died at jack.jar: Docker does not set $USER and Android 6.0's
#          jack/jack-admin use 'set -o nounset'. Fixed: USER is exported in the container.
#  run #2: Jack worked (222 compilations, 0 failures) and the build reached ~98 %, but one module failed: JDK 8's javac
#          (stricter than JDK 7's about missing superinterfaces) rejects frameworks/support/v4 against the API-4 SDK jar
#          ("cannot access RemoteControlClient"). Android 6.0 is meant to be built with OpenJDK 7, so the image now has
#          JDK 7 (Azul Zulu 7 = OpenJDK 7u352). Also: the ccache save failed with "No space left on device" because the
#          disk-merge step left only ~0.5 GB free on / (see the reserves below).
#  run #3: succeeded (ua_espresso3g-6.0.1-20261105.zip, flashed and boots). On the 7-inch Tab 2 it came up in landscape, because
#          the Unlegacy tree lacks the rotation setup that LineageOS has.
#  portrait_7in, first version: added ro.sf.hwrotation=270 plus the touchscreen and sensor axes. The screen STAYED landscape and only the
#          touchscreen turned, because Android 6.0.1's SurfaceFlinger ignores ro.sf.hwrotation (LineageOS 13 carries its own patch
#          for it).
#  portrait_7in, second version: added that SurfaceFlinger patch (and LineageOS' screenshot and rotation-animation hooks). Built, flashed,
#          boots in portrait. Reported on it: (a) the screen-off animation shows the last frame turned 90 degrees counter-clockwise and
#          squeezed; (b) at a screen rotation the new content shows for a split second before the rotation animation plays; (c) the
#          launcher is still the Android 4 style Launcher2; (d) the notification shade is see-through (not in screenshots; "Show CPU
#          usage" hides it).
#  third version (2026-11-09): (a) fixed inside the portrait_7in step (ColorFade turns its screenshot back), (c) the new launcher3
#          option, (b)+(d) the new gpu_composition option. FAILED to compile: services.core, ColorFade.java:514 "Duplicate local variable s"
#          (the new loop declared `s` in a method that already has one). Nothing else was reported as failed.
#  this version (2026-11-10): the ColorFade variables are renamed (texS, texT, corner). Tested by hand on the second build before this:
#          Developer options -> "Disable HW overlays" removes both (b) and (d) (and may feel laggier), which is exactly the state the
#          gpu_composition option creates from boot on (SurfaceFlinger reads ro.sf.force_gles_composition and sets that same switch).
#          All three options are on by default; untick portrait_7in for the 10.1-inch models, or any of them to build without it.
on:
  workflow_dispatch:
    inputs:
      device:
        description: "espresso3g = Tab 2 3G (P3100/P5100) | espresso = Tab 2 Wi-Fi (P3110/P5110)"
        type: choice
        options: [espresso3g, espresso]
        default: espresso3g
      variant:
        description: "user = like the old official builds | userdebug = adb root / debugging"
        type: choice
        options: [user, userdebug]
        default: user
      portrait_7in:
        description: "7-inch Tab 2 (P3100/P3110): boot in portrait like LineageOS does (patches SurfaceFlinger, touchscreen, sensors, the screen-off animation). Untick for the 10.1-inch models (P5100/P5110), or to build exactly like run #3"
        type: boolean
        default: true
      launcher3:
        description: "Home screen: AOSP's Android 6 launcher (Launcher3) instead of the Android 4 style Launcher2 that Unlegacy ships"
        type: boolean
        default: true
      gpu_composition:
        description: "Compose the whole screen with the GPU, none with hardware overlays (like Developer options -> Disable HW overlays, but from boot on). Aimed at the see-through notification shade and the flash before the rotation animation; a best guess. Untick to build without it"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: unlegacy-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UA_DEVICE: ${{ inputs.device }}
  UA_LUNCH: ua_${{ inputs.device }}-${{ inputs.variant }}
  UA_BRANCH: aosp-6.0
  UA_MANIFEST: https://github.com/Unlegacy-Android/android.git
  UA_PORTRAIT: ${{ inputs.portrait_7in }}
  UA_LAUNCHER3: ${{ inputs.launcher3 }}
  UA_GPUCOMP: ${{ inputs.gpu_composition }}

jobs:
  build:
    name: ${{ inputs.device }}-${{ inputs.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Start
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "Target: $UA_LUNCH"
          nproc; free -m; df -h / /mnt

      - name: Remove preinstalled software we do not need
        run: |
          sudo rm -rf /usr/share/swift /usr/local/julia* /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/.ghcup /usr/local/lib/heroku /usr/share/miniconda \
            /opt/hostedtoolcache /opt/microsoft /opt/google /opt/az /usr/lib/google-cloud-sdk /usr/lib/mono /usr/lib/firefox || true
          df -h /

      # Pinned to a commit (master as of 2025-03-28). Merges the free space of / and /mnt into one volume at /ua.
      # On today's ubuntu-24.04 runners /mnt is NOT a separate disk: both loop files are carved out of the root filesystem, so
      # what is left free on / afterwards is only temp-reserve-mb (run #2 had 512 MB, and the 1.6 GB ccache archive, which
      # actions/cache writes to / as the runner user, did not fit). Keep ~10 GB free on / (root-reserve must stay above temp-reserve).
      - name: Merge free disk space into one big volume at /ua
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          build-mount-path: /ua
          root-reserve-mb: 14336
          temp-reserve-mb: 10240
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Prepare /ua
        run: |
          sudo mkdir -p /ua
          sudo chown "$USER":"$(id -gn)" /ua
          mkdir -p /ua/src /ua/ccache /ua/home /ua/dist /ua/logs /ua/image /ua/tmp
          chmod 1777 /ua/tmp
          df -h / /mnt /ua; free -m
          avail=$(df -BG --output=avail /ua | tail -n1 | tr -dc 0-9)
          echo "Free space on /ua: ${avail} GB"
          if [ "$avail" -lt 30 ]; then echo "::error::Only ${avail} GB free on /ua; the build needs roughly 45 GB."; exit 1; fi
          if [ "$avail" -lt 45 ]; then echo "::warning::Only ${avail} GB free on /ua - tight. Watch the disk_free heartbeat lines in the build step."; fi
          rootavail=$(df -BG --output=avail / | tail -n1 | tr -dc 0-9)
          echo "Free space on / (docker images and the ccache archive live here): ${rootavail} GB"
          if [ "$rootavail" -lt 6 ]; then echo "::warning::Only ${rootavail} GB free on / - saving/restoring the ccache archive (~1.6 GB) may fail."; fi

      - name: Build the Ubuntu 18.04 build image
        run: |
          cd /ua/image
          cat > Dockerfile <<'EOF'
          ARG BASE=docker.io/library/ubuntu:18.04
          FROM ${BASE}
          ARG JDK7_URL=https://cdn.azul.com/zulu/bin/zulu7.56.0.11-ca-jdk7.0.352-linux_x64.tar.gz
          ENV DEBIAN_FRONTEND=noninteractive LC_ALL=C JAVA_HOME=/usr/lib/jvm/zulu7 PATH=/usr/lib/jvm/zulu7/bin:${PATH}
          RUN (apt-get update || (sed -i -E 's#https?://[a-z.]*ubuntu\.com/ubuntu#http://old-releases.ubuntu.com/ubuntu#g' /etc/apt/sources.list && apt-get update)) \
           && apt-get install -y --no-install-recommends python git curl ca-certificates ccache flex bison gperf build-essential zip unzip zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev libncurses5 libtinfo5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc bc lzop libssl-dev file rsync procps less xz-utils gawk patch perl \
           && apt-get clean && rm -rf /var/lib/apt/lists/*
          # JDK 7 on purpose: Android 6.0 is built and tested by Google with OpenJDK 7. JDK 8's javac fails on frameworks/support/v4
          # ("cannot access RemoteControlClient"). Ubuntu removed openjdk-7 from its archive, so use Azul Zulu 7 (an OpenJDK 7 build).
          RUN mkdir -p /usr/lib/jvm/zulu7 \
           && curl -fsSL --retry 6 --retry-delay 10 --retry-connrefused -o /tmp/jdk7.tar.gz "${JDK7_URL}" \
           && sha256sum /tmp/jdk7.tar.gz \
           && tar -xzf /tmp/jdk7.tar.gz -C /usr/lib/jvm/zulu7 --strip-components=1 \
           && rm -f /tmp/jdk7.tar.gz \
           && javac -version && test -f /usr/lib/jvm/zulu7/lib/tools.jar
          EOF
          ok=0
          for base in docker.io/library/ubuntu:18.04 mirror.gcr.io/library/ubuntu:18.04; do
            if docker build --build-arg "BASE=$base" -t ua-aosp60:bionic .; then ok=1; break; fi
            echo "::warning::image build failed on $base"
          done
          [ "$ok" = 1 ] || { echo "::error::could not build the build image (see the docker output above; the JDK 7 download from cdn.azul.com is the usual suspect)"; exit 1; }
          docker run --rm ua-aosp60:bionic bash -c 'java -version 2>&1; javac -version 2>&1; echo "JAVA_HOME=$JAVA_HOME"; python --version 2>&1; make --version | head -n1'
          docker run --rm ua-aosp60:bionic bash -c 'java -version 2>&1 | grep -q "1\.7\." && javac -version 2>&1 | grep -q "1\.7\." && python --version 2>&1 | grep -q "2\.7"' \
            || { echo "::error::the build image does not have Java 1.7 and Python 2.7 as expected"; exit 1; }

      - name: Install repo and a git identity
        run: |
          sudo curl -fsSL --retry 5 --retry-delay 5 -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod +x /usr/local/bin/repo
          git config --global user.name "UA Builder"
          git config --global user.email "ua-builder@localhost"
          git config --global color.ui false
          git config --global --add safe.directory '*'
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 120
          cp ~/.gitconfig /ua/home/.gitconfig   # the container's HOME: lets 'git am' (vendorsetup.sh patches) work as root

      - name: repo init + sync (retries with back-off)
        run: |
          cd /ua/src
          python3 /usr/local/bin/repo init -u "$UA_MANIFEST" -b "$UA_BRANCH" --depth=1 --no-clone-bundle </dev/null
          for n in 1 2 3 4 5 6; do
            echo "::group::repo sync attempt $n"
            if python3 /usr/local/bin/repo sync -c --no-tags --no-clone-bundle --force-sync -j8 </dev/null; then echo "::endgroup::"; break; fi
            echo "::endgroup::"
            [ "$n" -lt 6 ] || { echo "::error::repo sync failed 6 times"; exit 1; }
            sleep $((n * 30))
          done
          for f in Makefile build/envsetup.sh vendor/unlegacy/vendorsetup.sh device/samsung/espresso3g/BoardConfig.mk device/samsung/espresso prebuilts/gcc/linux-x86/arm/arm-eabi-4.7; do
            [ -e "$f" ] || { echo "::error::$f is missing after sync"; exit 1; }
          done
          df -h /ua

      # The 7-inch Tab 2 has a landscape panel that LineageOS runs rotated (ro.sf.hwrotation=270) so that the tablet is a portrait device,
      # turning the touchscreen and sensor axes along with it (LineageOS: init.espresso.variant.sh). Android 6.0.1's own SurfaceFlinger
      # ignores that property, so LineageOS 13 patches SurfaceFlinger (frameworks/native) and a few frameworks/base files; the Unlegacy
      # tree has none of it, so it boots in landscape. This step adds all of it, plus the fix for the screen-off animation (ColorFade);
      # the script's header explains each part. It stops with an error if the Unlegacy tree no longer looks the way the script expects,
      # so a build never gets half a patch.
      - name: Apply the 7-inch portrait fix (portrait_7in)
        if: ${{ inputs.portrait_7in }}
        run: |
          cat > /ua/apply-portrait-7in.py <<'PYEOF'
          #!/usr/bin/env python3
          # Makes the 7-inch Galaxy Tab 2 (P3100/P3110/P3113) boot in portrait, the way LineageOS 13 does.
          # Usage: apply-portrait-7in.py <root of the Android source tree>
          #
          # The 7" Tab 2 has a 1024x600 panel that is mounted turned by 90 degrees. LineageOS runs it rotated
          # (ro.sf.hwrotation=270) so that the tablet is a portrait device, and turns the touchscreen and the accelerometer/compass
          # axes with it. Android 6.0.1's own SurfaceFlinger does NOT read ro.sf.hwrotation (the property is simply ignored), so
          # LineageOS carries a small patch for it, and so does this script. Six things are done:
          #   1. device/samsung/espresso/device-common.mk:  ro.sf.hwrotation=270 (goes into /system/build.prop)
          #   2. device/samsung/espresso/rootdir/init.espresso.rc:  "on property:ro.sf.hwrotation=270" -> touchscreen pivot = 1
          #   3. device/samsung/espresso/libsensors/SensorBase.cpp (+ init.espresso.sensors.rc):  accelerometer and magnetometer
          #      get position = 6 when ro.sf.hwrotation is 270
          #   4. frameworks/native/services/surfaceflinger (3 files):  the three ro.sf.hwrotation hooks of LineageOS 13: the display
          #      reports 600x1024, and the display transform is turned by the extra rotation. THIS is the part that makes the screen
          #      itself portrait; the first version of this fix lacked it, so the screen stayed landscape while the touchscreen turned.
          #   5. frameworks/base (3 files):  LineageOS' matching hooks for screenshots and for the rotation animation.
          #   6. frameworks/base ColorFade.java (the screen-off / screen-on fade):  it draws a screenshot, and SurfaceFlinger delivers that
          #      screenshot in the orientation of the panel itself (1024x600, lying on its side), but the fade draws it into a portrait
          #      600x1024 surface without turning it back, so the last frame appeared turned by 90 degrees and squeezed. The fix turns the
          #      texture coordinates by the panel rotation. (A pixel simulation of the SurfaceFlinger transforms shows it is exact.)
          # Everything except the property does nothing unless ro.sf.hwrotation is set. Safe to run twice; stops with an error if the
          # expected text is not where it should be (so a changed Unlegacy tree never gets half a patch).
          import os
          import sys

          ROOT = sys.argv[1] if len(sys.argv) > 1 else "."
          DEV = "device/samsung/espresso"
          SF = "frameworks/native/services/surfaceflinger"
          WM = "frameworks/base/services/core/java/com/android/server/wm"
          SYSUI = "frameworks/base/packages/SystemUI/src/com/android/systemui/screenshot"


          def fail(msg):
              print("::error::portrait fix: " + msg)
              sys.exit(1)


          def replace_once(text, old, new, what):
              n = text.count(old)
              if n != 1:
                  fail("expected text found %d times (need exactly 1) in %s; the Unlegacy tree has changed:\n%s" % (n, what, old))
              return text.replace(old, new, 1)


          def edit(rel, marker, change):
              """Apply change(text, name) to ROOT/rel unless the file already contains marker."""
              path = os.path.join(ROOT, rel)
              if not os.path.isfile(path):
                  fail(rel + " does not exist")
              with open(path, encoding="utf-8", newline="") as f:
                  text = f.read()
              if marker in text:
                  print("  already patched: " + rel)
                  return
              new = change(text, rel)
              with open(path, "w", encoding="utf-8", newline="") as f:
                  f.write(new)
              print("  patched: " + rel)


          def replacing(*pairs):
              """Build a change function that does several replace_once() calls in order."""
              def change(text, what):
                  for old, new in pairs:
                      text = replace_once(text, old, new, what)
                  return text
              return change


          # ===== 1. the property ====================================================================================================
          PROP_OLD = "    ro.opengles.version=131072 \\\n    ro.sf.lcd_density=160\n"
          PROP_NEW = PROP_OLD + r'''
          # 7" Tab 2 (P3100/P3110): the panel is mounted rotated, so run it in portrait like LineageOS does. SurfaceFlinger (patched by
          # the portrait_7in step), init.espresso.rc and the sensors HAL all key off this property. Not for the 10.1" models (P5100/P5110).
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.sf.hwrotation=270
          '''
          edit(DEV + "/device-common.mk", "ro.sf.hwrotation", replacing((PROP_OLD, PROP_NEW)))

          # ===== 2. touchscreen axes (init writes the sysfs file of the mms136 driver) ===============================================
          RC_ADD = r'''
          # 7" Tab 2: the panel is mounted rotated (ro.sf.hwrotation=270, see device-common.mk), so turn the touchscreen axes with it.
          # LineageOS does this from init.espresso.variant.sh.
          on property:ro.sf.hwrotation=270
              write /sys/devices/virtual/sec/tsp/pivot 1
          '''
          edit(DEV + "/rootdir/init.espresso.rc", "on property:ro.sf.hwrotation=270",
               lambda t, w: (t if t.endswith("\n") else t + "\n") + RC_ADD)

          # ===== 3. sensor axes (the sensors HAL writes the sysfs files) =============================================================
          CHOWN_OLD = "    chown system input /sys/class/input/input3/position\n"
          CHOWN_NEW = ("    chown system input /sys/class/input/input1/position\n"
                       "    chown system input /sys/class/input/input2/position\n") + CHOWN_OLD
          edit(DEV + "/rootdir/init.espresso.sensors.rc", "input2/position", replacing((CHOWN_OLD, CHOWN_NEW)))

          SENSORBASE_CTOR_OLD = r'''SensorBase::SensorBase(
                  const char* dev_name,
                  const char* data_name)
              : dev_name(dev_name), data_name(data_name),
                dev_fd(-1), data_fd(-1)
          {
              if (data_name) {
                  data_fd = openInput(data_name);
              }
          }
          '''
          SENSORBASE_CTOR_NEW = r'''/*
           * 7" Tab 2 (P3100/P3110): the landscape panel is run rotated by 270 degrees (ro.sf.hwrotation, set in
           * device-common.mk) so that the tablet is a portrait device. The accelerometer and the magnetometer are not
           * turned with it, so tell their kernel drivers to remap the axes: position 6 is the value that the LineageOS
           * variant script writes for these tablets. Does nothing on a panel that is not rotated.
           */
          static void applyPanelPosition(const char* sensorName, const char* eventName)
          {
              char prop[PROPERTY_VALUE_MAX];
              char path[PATH_MAX];
              int fd;

              if (strcmp(sensorName, "accelerometer") != 0 &&
                      strcmp(sensorName, "geomagnetic") != 0)
                  return;
              if (property_get("ro.sf.hwrotation", prop, "0") <= 0 || atoi(prop) != 270)
                  return;

              snprintf(path, sizeof(path), "/sys/class/input/%s/device/position", eventName);
              fd = open(path, O_WRONLY);
              if (fd < 0) {
                  ALOGE("%s: cannot open %s (%s)", sensorName, path, strerror(errno));
                  return;
              }
              if (write(fd, "6", 1) != 1)
                  ALOGE("%s: cannot write %s (%s)", sensorName, path, strerror(errno));
              else
                  ALOGI("%s: panel is rotated, set %s to 6", sensorName, path);
              close(fd);
          }

          SensorBase::SensorBase(
                  const char* dev_name,
                  const char* data_name)
              : dev_name(dev_name), data_name(data_name),
                dev_fd(-1), data_fd(-1)
          {
              if (data_name) {
                  data_fd = openInput(data_name);
                  if (data_fd >= 0)
                      applyPanelPosition(data_name, input_name);
              }
          }
          '''
          edit(DEV + "/libsensors/SensorBase.cpp", "applyPanelPosition", replacing(
              ("#include <cutils/log.h>\n", "#include <cutils/log.h>\n#include <cutils/properties.h>\n"),
              ("#include <cstring>\n", "#include <cstring>\n#include <stdio.h>\n#include <stdlib.h>\n"),
              (SENSORBASE_CTOR_OLD, SENSORBASE_CTOR_NEW)))

          # ===== 4. SurfaceFlinger: the three ro.sf.hwrotation hooks of LineageOS 13 =================================================
          # (a) DisplayDevice.h: orientationToTransfrom() now needs the display type, so it can no longer be static
          edit(SF + "/DisplayDevice.h", "    status_t orientationToTransfrom(", replacing(
              ("    static status_t orientationToTransfrom(int orientation,\n",
               "    status_t orientationToTransfrom(int orientation,\n")))

          # (b) DisplayDevice.cpp: turn the display transform by the extra rotation, and size the default frame accordingly
          DD_ORIENT_OLD = r'''status_t DisplayDevice::orientationToTransfrom(
                  int orientation, int w, int h, Transform* tr)
          {
              uint32_t flags = 0;
              switch (orientation) {
          '''
          DD_ORIENT_NEW = r'''status_t DisplayDevice::orientationToTransfrom(
                  int orientation, int w, int h, Transform* tr)
          {
              uint32_t flags = 0;
              char value[PROPERTY_VALUE_MAX];
              property_get("ro.sf.hwrotation", value, "0");
              int additionalRot = atoi(value);

              if (additionalRot && mType == DISPLAY_PRIMARY) {
                  additionalRot /= 90;
                  if (orientation == DisplayState::eOrientationUnchanged) {
                      orientation = additionalRot;
                  } else {
                      orientation += additionalRot;
                      orientation %= 4;
                  }
              }

              switch (orientation) {
          '''
          DD_FRAME_OLD = r'''        // in that case we assume the whole display frame.
                  frame = Rect(w, h);
          '''
          DD_FRAME_NEW = r'''        // in that case we assume the whole display frame.
                  char value[PROPERTY_VALUE_MAX];
                  property_get("ro.sf.hwrotation", value, "0");
                  int additionalRot = atoi(value);

                  if (additionalRot == 90 || additionalRot == 270) {
                      frame = Rect(h, w);
                  } else {
                      frame = Rect(w, h);
                  }
          '''
          edit(SF + "/DisplayDevice.cpp", "additionalRot", replacing(
              (DD_ORIENT_OLD, DD_ORIENT_NEW), (DD_FRAME_OLD, DD_FRAME_NEW)))

          # (c) SurfaceFlinger.cpp: report the display as 600x1024 (width and height swapped) when it is rotated by 90 or 270
          SF_INFO_OLD = r'''        info.w = hwConfig.width;
                  info.h = hwConfig.height;
                  info.xdpi = xdpi;
                  info.ydpi = ydpi;
                  info.fps = float(1e9 / hwConfig.refresh);
          '''
          SF_INFO_NEW = r'''        char value[PROPERTY_VALUE_MAX];
                  property_get("ro.sf.hwrotation", value, "0");
                  int additionalRot = atoi(value) / 90;
                  if ((type == DisplayDevice::DISPLAY_PRIMARY) && (additionalRot & DisplayState::eOrientationSwapMask)) {
                      info.h = hwConfig.width;
                      info.w = hwConfig.height;
                      info.xdpi = ydpi;
                      info.ydpi = xdpi;
                  }
                  else {
                      info.w = hwConfig.width;
                      info.h = hwConfig.height;
                      info.xdpi = xdpi;
                      info.ydpi = ydpi;
                  }
                  info.fps = float(1e9 / hwConfig.refresh);
          '''
          edit(SF + "/SurfaceFlinger.cpp", "additionalRot", replacing((SF_INFO_OLD, SF_INFO_NEW)))

          # ===== 5. frameworks/base: screenshots and the rotation animation know about the rotated panel (LineageOS 13 hooks) =========
          MSF_FIELD = ('    // Rotation of the display panel itself (ro.sf.hwrotation in 90 degree steps), see the portrait_7in option\n'
                       '    private final int mSfHwRotation = android.os.SystemProperties.getInt("ro.sf.hwrotation", 0) / 90;\n')

          # (a) WindowManagerService: screenshots
          KG_OLD = "    final private KeyguardDisableHandler mKeyguardDisableHandler;\n"
          WMS_ROT_OLD = "                int rot = getDefaultDisplayContentLocked().getDisplay().getRotation();\n"
          WMS_ROT_NEW = WMS_ROT_OLD + ("                // Allow for abnormal hardware orientation\n"
                                       "                rot = (rot + mSfHwRotation) % 4;\n")
          edit(WM + "/WindowManagerService.java", "mSfHwRotation", replacing(
              (KG_OLD, KG_OLD + "\n" + MSF_FIELD),
              (WMS_ROT_OLD, WMS_ROT_NEW)))

          # (b) ScreenRotationAnimation: the snapshot taken for the rotation animation
          SRA_SIZE_OLD = r'''        if (originalRotation == Surface.ROTATION_90
                          || originalRotation == Surface.ROTATION_270) {
                      mWidth = originalHeight;
                      mHeight = originalWidth;
                  } else {
                      mWidth = originalWidth;
                      mHeight = originalHeight;
                  }
          '''
          SRA_SIZE_NEW = r'''        // Allow for abnormal hardware orientation
                  mSnapshotRotation = (4 - android.os.SystemProperties.getInt("ro.sf.hwrotation",0) / 90) % 4;
                  if (mSnapshotRotation == Surface.ROTATION_0 || mSnapshotRotation == Surface.ROTATION_180) {
                      if (originalRotation == Surface.ROTATION_90
                           || originalRotation == Surface.ROTATION_270) {
                          mWidth = originalHeight;
                          mHeight = originalWidth;
                      } else {
                          mWidth = originalWidth;
                          mHeight = originalHeight;
                      }
                  } else {
                      if (originalRotation == Surface.ROTATION_90
                          || originalRotation == Surface.ROTATION_270) {
                          mWidth = originalWidth;
                          mHeight = originalHeight;
                      } else {
                          mWidth = originalHeight;
                          mHeight = originalWidth;
                      }
                  }
          '''
          edit(WM + "/ScreenRotationAnimation.java", "mSnapshotRotation", replacing(
              ("    int mWidth, mHeight;\n", "    int mWidth, mHeight;\n    int mSnapshotRotation;\n"),
              (SRA_SIZE_OLD, SRA_SIZE_NEW),
              ("        int delta = DisplayContent.deltaRotation(rotation, Surface.ROTATION_0);\n",
               "        int delta = DisplayContent.deltaRotation(rotation, mSnapshotRotation);\n")))

          # (c) SystemUI's screenshot code
          GS_FIELD_OLD = "    private MediaActionSound mCameraSound;\n"
          GS_ROT_OLD = "        float degrees = getDegreesForRotation(mDisplay.getRotation());\n"
          GS_ROT_NEW = ("        int rot = mDisplay.getRotation();\n"
                        "        // Allow for abnormal hardware orientation\n"
                        "        rot = (rot + mSfHwRotation) % 4;\n"
                        "        float degrees = getDegreesForRotation(rot);\n")
          edit(SYSUI + "/GlobalScreenshot.java", "mSfHwRotation", replacing(
              (GS_FIELD_OLD, GS_FIELD_OLD + "\n" + MSF_FIELD),
              (GS_ROT_OLD, GS_ROT_NEW)))

          # ===== 6. ColorFade: the screen-off / screen-on fade ======================================================================
          # The four texture coordinates belong to the quad's corners (0,0) (0,h) (w,h) (w,0). The screenshot is the picture as it lies on
          # the panel, i.e. the natural picture turned clockwise by the panel rotation, so each corner has to read the point of the
          # screenshot that the display transform moved there. For 270 degrees that is (1,0) (0,0) (0,1) (1,1); for 0 degrees nothing changes.
          # NOTE on names: this block sits inside captureScreenshotTextureAndSetViewport(), which already has locals called st and s (a
          # SurfaceTexture and its Surface). Java forbids declaring a local again inside a nested block, so every name below (texS, texT,
          # corner, ...) was checked against the whole method; the first version of this patch used s and t and broke the build
          # ("Duplicate local variable s"). tools: stubcheck.py compiles the whole patched file and would have caught it.
          CF = "frameworks/base/services/core/java/com/android/server/display"
          CF_OLD = r'''            mTexCoordBuffer.put(0, 0f); mTexCoordBuffer.put(1, 0f);
                      mTexCoordBuffer.put(2, 0f); mTexCoordBuffer.put(3, 1f);
                      mTexCoordBuffer.put(4, 1f); mTexCoordBuffer.put(5, 1f);
                      mTexCoordBuffer.put(6, 1f); mTexCoordBuffer.put(7, 0f);
          '''
          CF_NEW = r'''            // The screenshot is in the orientation of the physical panel. When the panel is mounted turned
                      // (ro.sf.hwrotation, the 7" Tab 2) that is not the natural orientation this surface is drawn in, so
                      // turn the texture back by the same amount (see the portrait_7in option). 0 degrees: unchanged.
                      final int panelRotation = (SystemProperties.getInt("ro.sf.hwrotation", 0) / 90) & 3;
                      if (panelRotation != 0) {
                          Slog.i(TAG, "Turning the screenshot texture back for the rotated panel (" + (panelRotation * 90) + " degrees)");
                      }
                      final float[] cornerU = { 0f, 0f, 1f, 1f };    // corners in vertex order: (0,0) (0,h) (w,h) (w,0)
                      final float[] cornerV = { 0f, 1f, 1f, 0f };
                      for (int corner = 0; corner < 4; corner++) {
                          final float texS, texT;
                          switch (panelRotation) {
                              case 1:  texS = cornerV[corner];      texT = 1f - cornerU[corner]; break;
                              case 2:  texS = 1f - cornerU[corner]; texT = 1f - cornerV[corner]; break;
                              case 3:  texS = 1f - cornerV[corner]; texT = cornerU[corner];      break;
                              default: texS = cornerU[corner];      texT = cornerV[corner];      break;
                          }
                          mTexCoordBuffer.put(2 * corner, texS);
                          mTexCoordBuffer.put(2 * corner + 1, texT);
                      }
          '''
          edit(CF + "/ColorFade.java", "panelRotation", replacing((CF_OLD, CF_NEW)))

          print("portrait fix: done (7-inch Tab 2 will boot in portrait)")
          PYEOF
          python3 /ua/apply-portrait-7in.py /ua/src
          for d in device/samsung/espresso frameworks/native frameworks/base; do
            echo "== $d"; git -C "/ua/src/$d" diff --stat
          done

      # Unlegacy lists the Android 4 style Launcher2 in build/target/product/core.mk. AOSP 6.0.1 also contains Launcher3 (the Android 6
      # launcher, and it is in the manifest), so the swap is one word in one makefile. The script first checks that Launcher3 is in the tree.
      - name: Use Launcher3 instead of Launcher2 (launcher3)
        if: ${{ inputs.launcher3 }}
        run: |
          cat > /ua/apply-launcher3.py <<'PYEOF'
          #!/usr/bin/env python3
          # Swaps the home screen app: Launcher2 (the Android 4 launcher that Unlegacy ships) -> Launcher3 (the Android 6 launcher of AOSP 6.0.1).
          # Usage: apply-launcher3.py <root of the Android source tree>
          #
          # Both launchers are in the AOSP 6.0.1 source (packages/apps/Launcher2 and packages/apps/Launcher3, both in the Unlegacy manifest).
          # Unlegacy's build tree simply lists Launcher2 in build/target/product/core.mk, and that is the only place that names a launcher
          # (nothing in the device or vendor trees does), so the swap is one word in one makefile. It checks first that Launcher3 really
          # is in the synced tree, so a build never starts with a launcher that cannot be built. Safe to run twice.
          import os
          import re
          import sys

          ROOT = sys.argv[1] if len(sys.argv) > 1 else "."


          def fail(msg):
              print("::error::launcher3: " + msg)
              sys.exit(1)


          amk = os.path.join(ROOT, "packages/apps/Launcher3/Android.mk")
          if not os.path.isfile(amk):
              fail("packages/apps/Launcher3/Android.mk is not in the synced source tree")
          with open(amk, encoding="utf-8", errors="replace") as f:
              amk_text = f.read()
          if not re.search(r"^\s*LOCAL_PACKAGE_NAME\s*:=\s*Launcher3\s*$", amk_text, re.M):
              fail("packages/apps/Launcher3/Android.mk does not define the package Launcher3")
          for line in amk_text.splitlines():
              if re.match(r"\s*(LOCAL_PACKAGE_NAME|LOCAL_OVERRIDES_PACKAGES|LOCAL_PRIVILEGED_MODULE|LOCAL_SDK_VERSION|LOCAL_MIN_SDK_VERSION)\b", line):
                  print("  Launcher3/Android.mk: " + line.strip())

          core = os.path.join(ROOT, "build/target/product/core.mk")
          if not os.path.isfile(core):
              fail("build/target/product/core.mk does not exist")
          with open(core, encoding="utf-8", newline="") as f:
              text = f.read()

          OLD = "    Launcher2 \\\n"
          NEW = "    Launcher3 \\\n"
          if text.count(NEW) == 1 and text.count(OLD) == 0:
              print("  already patched: build/target/product/core.mk")
          else:
              if text.count(OLD) != 1:
                  fail("expected '    Launcher2 \\' exactly once in build/target/product/core.mk, found %d; the Unlegacy tree has changed" % text.count(OLD))
              with open(core, "w", encoding="utf-8", newline="") as f:
                  f.write(text.replace(OLD, NEW, 1))
              print("  patched: build/target/product/core.mk (Launcher2 -> Launcher3)")

          print("launcher3: done (the home screen will be AOSP's Launcher3)")
          PYEOF
          python3 /ua/apply-launcher3.py /ua/src
          git -C /ua/src/build diff --stat

      # SurfaceFlinger gets a boot-time property, ro.sf.force_gles_composition, that sets the same switch as Developer options ->
      # "Disable HW overlays": every layer is composed with OpenGL ES and none goes to the hardware composer (a prebuilt IMG blob that
      # seems to mis-order layers). Aimed at the see-through notification shade and the flash before the rotation animation.
      # Independent of portrait_7in (it also applies to the 10.1-inch models).
      - name: Compose the screen with the GPU only (gpu_composition)
        if: ${{ inputs.gpu_composition }}
        run: |
          cat > /ua/apply-gpu-composition.py <<'PYEOF'
          #!/usr/bin/env python3
          # Makes SurfaceFlinger compose every frame with the GPU, from boot on, instead of handing layers to the display's hardware overlays.
          # Usage: apply-gpu-composition.py <root of the Android source tree>
          #
          # Why: on the flashed builds the notification shade is see-through (screenshots of it look right) and, at a screen rotation, the new
          # screen shows for a moment before the rotation animation. Both look like the same kind of fault: the tablet's hardware composer
          # (a prebuilt IMG SGX blob) mis-orders layers when SurfaceFlinger composes some of them itself (the snapshot of the old screen
          # during a rotation, a translucent window) and hands the rest to the overlays. "Show CPU usage" in Developer options adds one more
          # layer than the overlays can take, which makes the composer give up and everything is drawn with OpenGL ES, and that made the
          # shade look right. That is a guess about the cause; what is certain is that it is the same state this option creates.
          # What it does: Android's SurfaceFlinger already has a switch for it, Developer options -> "Disable HW overlays" (it marks every layer
          # "skip", so none is given to the composer). It is only reachable at run time and resets at every boot. This patch reads the property
          # ro.sf.force_gles_composition once, when SurfaceFlinger starts, and sets that same switch; device-common.mk sets the property to 1.
          # Cost: the GPU draws every frame (a little more power; video is composed by the GPU too). To compare without rebuilding:
          # Developer options -> tick, then untick "Disable HW overlays" turns the overlays back on until the next reboot.
          # Safe to run twice; stops with an error if the expected text is not where it should be.
          import os
          import sys

          ROOT = sys.argv[1] if len(sys.argv) > 1 else "."
          DEV = "device/samsung/espresso"
          SF = "frameworks/native/services/surfaceflinger"
          PROP = "ro.sf.force_gles_composition"


          def fail(msg):
              print("::error::gpu composition: " + msg)
              sys.exit(1)


          def patch(rel, marker, old, new):
              path = os.path.join(ROOT, rel)
              if not os.path.isfile(path):
                  fail(rel + " does not exist")
              with open(path, encoding="utf-8", newline="") as f:
                  text = f.read()
              if marker in text:
                  print("  already patched: " + rel)
                  return
              if text.count(old) != 1:
                  fail("expected text found %d times (need exactly 1) in %s; the Unlegacy tree has changed:\n%s" % (text.count(old), rel, old))
              with open(path, "w", encoding="utf-8", newline="") as f:
                  f.write(text.replace(old, new, 1))
              print("  patched: " + rel)


          # 1. SurfaceFlinger reads the property once at start-up and sets mDebugDisableHWC (the switch behind "Disable HW overlays")
          SF_OLD = '    ALOGI_IF(mDebugRegion, "showupdates enabled");\n'
          SF_NEW = (
              "    // gpu_composition option: compose every layer with OpenGL ES, none with the hardware composer's overlays. This is what\n"
              "    // Developer options -> \"Disable HW overlays\" does (transaction 1008), but from boot on.\n"
              '    property_get("' + PROP + '", value, "0");\n'
              "    mDebugDisableHWC = atoi(value) ? 1 : 0;\n"
              '    ALOGI_IF(mDebugDisableHWC, "every layer is composed with the GPU (' + PROP + ')");\n'
              + SF_OLD)
          patch(SF + "/SurfaceFlinger.cpp", PROP, SF_OLD, SF_NEW)

          # 2. the property itself, next to the other display properties (this anchor is also the one the portrait_7in patch builds on; both
          #    orders of the two patches work)
          MK_OLD = "    ro.opengles.version=131072 \\\n    ro.sf.lcd_density=160\n"
          MK_NEW = MK_OLD + (
              "\n"
              "# Compose every frame with the GPU (see the gpu_composition option); SurfaceFlinger reads this once at start-up.\n"
              "PRODUCT_PROPERTY_OVERRIDES += \\\n"
              "    " + PROP + "=1\n")
          patch(DEV + "/device-common.mk", PROP, MK_OLD, MK_NEW)

          print("gpu composition: done (SurfaceFlinger will compose everything with the GPU)")
          PYEOF
          python3 /ua/apply-gpu-composition.py /ua/src
          for d in device/samsung/espresso frameworks/native; do
            echo "== $d"; git -C "/ua/src/$d" diff --stat
          done

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: /ua/ccache
          # "v2": the run #1 cache was keyed on the compilers' mtimes, which change on every fresh sync, so it can never hit again.
          key: ccache-v2-${{ inputs.device }}-${{ inputs.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v2-${{ inputs.device }}-${{ inputs.variant }}-
            ccache-v2-${{ inputs.device }}-
            ccache-v2-

      - name: Build (make otapackage inside the Ubuntu 18.04 container)
        id: build
        timeout-minutes: 350
        run: |
          cat > /ua/in-container.sh <<'EOF'
          set +eu
          ulimit -n "$(ulimit -Hn)" 2>/dev/null
          # Docker does not set USER/LOGNAME, but Android 6.0's jack and jack-admin run with 'set -o nounset' and build
          # "$TMPDIR/jack-$USER"; without USER they die with "USER: unbound variable" (that is what ended run #1).
          export USER=${USER:-root} LOGNAME=${LOGNAME:-root}
          # compiler_check=content: every run starts from a fresh checkout, so the compilers get new mtimes, and with
          # ccache's default (mtime) every cached object would miss. Hashing the compiler binary keeps the cache valid.
          export LC_ALL=C USE_CCACHE=1 CCACHE_DIR=/ccache CCACHE_COMPRESS=1 CCACHE_COMPILERCHECK=content
          cd /src || exit 90
          echo "container: $(javac -version 2>&1) | $(java -version 2>&1 | sed -n 1p) | $(python --version 2>&1) | $(make --version | head -n1) | nproc=$(nproc) | USER=$USER HOME=$HOME JAVA_HOME=$JAVA_HOME"
          prebuilts/misc/linux-x86/ccache/ccache -M 6G || echo "ccache -M failed (continuing)"
          . build/envsetup.sh || { echo "envsetup.sh failed"; exit 91; }
          lunch "$UA_LUNCH" || { echo "lunch $UA_LUNCH failed"; exit 92; }
          [ -n "$TARGET_PRODUCT" ] || { echo "lunch did not set TARGET_PRODUCT"; exit 93; }
          # -k: keep going after an error, so one run reports every failing module instead of only the first one.
          echo "=== make -k -j$UA_JOBS otapackage  $(date '+%F %T') ==="
          make -k -j"$UA_JOBS" otapackage; rc=$?
          echo "=== finished rc=$rc  $(date '+%F %T') ==="
          prebuilts/misc/linux-x86/ccache/ccache -s
          exit $rc
          EOF
          docker rm -f ua-build >/dev/null 2>&1 || true
          JOBS=$(( $(nproc) + 1 ))
          # Leave ~15 min of the 6 h job limit for saving ccache + uploading, so those steps still get to run.
          limit=$(( 345 * 60 - ($(date +%s) - JOB_START) ))
          echo "Time left for the build: $((limit / 60)) min (make -j$JOBS)"
          if [ "$limit" -lt 600 ]; then echo "::error::less than 10 minutes left for the build"; exit 1; fi
          # (the sleep must not inherit the step's stdout, or an orphaned sleep could keep the step "running" after the build ends)
          ( while sleep 300 >/dev/null 2>&1; do echo "[heartbeat] $(date '+%F %T') $(free -m | awk '/Mem:/{print "mem_avail=" $7 "MB"}') $(df -h /ua | awk 'NR==2{print "disk_free=" $4}') load=$(cut -d' ' -f1 /proc/loadavg)"; done ) &
          hb=$!
          set +e
          timeout -k 60 "$limit" docker run --rm --name ua-build --network=host \
            -v /ua/src:/src -v /ua/ccache:/ccache -v /ua/home:/ua-home -v /ua/tmp:/tmp \
            -v /ua/in-container.sh:/ua/in-container.sh:ro \
            -e HOME=/ua-home -e USER=root -e LOGNAME=root -e UA_LUNCH="$UA_LUNCH" -e UA_JOBS="$JOBS" \
            ua-aosp60:bionic bash /ua/in-container.sh 2>&1 | tee /ua/logs/build.log
          rc=${PIPESTATUS[0]}
          kill "$hb" 2>/dev/null
          if [ "$rc" -eq 124 ]; then echo "::warning::Stopped at the time limit. Run the workflow again: the saved ccache makes the next pass much faster."; fi
          case "$rc" in
            90|91|92|93) echo "::error::Setting up the build inside the container failed (exit $rc: 90 no /src, 91 envsetup.sh, 92 lunch, 93 no TARGET_PRODUCT)." ;;
          esac
          if [ "$rc" -ne 0 ] && [ -s /ua/logs/build.log ]; then
            # Short failure report on the run's summary page, so the cause can be read (or pasted) without opening the 4 MB log.
            {
              echo "### Build step failed (exit $rc)"
              echo "Failing make targets (with -k every independent target is still built, so this lists them all):"
              echo '```'
              grep -E '^make: \*\*\* \[' /ua/logs/build.log | head -n 15 | cut -c1-300
              echo '```'
              echo "First compiler errors:"
              echo '```'
              grep -n -A2 -P ': error:|^ERROR: (?!No Jack server)' /ua/logs/build.log | head -n 30 | cut -c1-300
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit "$rc"

      - name: Stop container and fix file ownership
        id: post
        if: ${{ always() }}
        run: |
          docker rm -f ua-build >/dev/null 2>&1 || true
          # Jack server log (where Jack out-of-memory / crash messages end up); /ua/tmp is the container's /tmp.
          sudo find /ua/tmp -maxdepth 2 -type f -name 'jack-*.log' -exec cp -f {} /ua/logs/ \; 2>/dev/null || true
          sudo chown -R "$USER":"$(id -gn)" /ua/ccache /ua/logs /ua/dist 2>/dev/null || true
          ls -la /ua/logs || true
          if [ -n "$(ls -A /ua/ccache 2>/dev/null)" ]; then echo "has_ccache=true" >> "$GITHUB_OUTPUT"; fi
          du -sh /ua/ccache 2>/dev/null || true
          df -h / /ua

      - name: Save ccache
        if: ${{ always() && steps.post.outputs.has_ccache == 'true' && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: /ua/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Collect result
        id: collect
        if: ${{ steps.build.outcome == 'success' }}
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          out=/ua/src/out/target/product/$UA_DEVICE
          z=$(find "$out" -maxdepth 1 -type f -name "ua_${UA_DEVICE}-[0-9]*.zip" -printf '%T@ %p\n' | sort -nr | sed -n 1p | cut -d' ' -f2-)
          [ -n "$z" ] || z=$(find "$out" -maxdepth 1 -type f -name '*-ota-*.zip' -printf '%T@ %p\n' | sort -nr | sed -n 1p | cut -d' ' -f2-)
          [ -n "$z" ] || { echo "::error::no OTA zip found in $out"; exit 1; }
          unzip -tq "$z"
          n=$(basename "$z")
          cp "$z" "/ua/dist/$n"
          cd /ua/dist
          md5sum "$n" | tee "$n.md5"
          sha256sum "$n" | tee "$n.sha256"
          size=$(du -h "$n" | cut -f1)
          portrait="portrait fix: not applied (portrait_7in was off)"
          if [ "$UA_PORTRAIT" = "true" ]; then
            if grep -q '^ro.sf.hwrotation=270$' "$out/system/build.prop" 2>/dev/null \
               && grep -q '^on property:ro.sf.hwrotation=270$' "$out/root/init.espresso.rc" 2>/dev/null \
               && grep -qa 'ro.sf.hwrotation' "$out/system/lib/hw/sensors.omap4.so" 2>/dev/null \
               && grep -qa 'ro.sf.hwrotation' "$out/system/lib/libsurfaceflinger.so" 2>/dev/null; then
              portrait="portrait fix: found in the finished image (ro.sf.hwrotation=270 in build.prop, touchscreen rule in init.espresso.rc, sensors library, SurfaceFlinger)"
            else
              portrait="portrait fix: applied to the source, but NOT everything was found in the finished image - check the log"
              echo "::warning::portrait fix: not everything was found in the finished image"
            fi
          fi
          # the screen-off fix is Java code in services.jar (or services.odex when the build is pre-optimised): look for the log line it adds
          fade="screen-off fix: not applied (portrait_7in was off)"
          if [ "$UA_PORTRAIT" = "true" ]; then
            dexbin=$(mktemp)
            { unzip -p "$out/system/framework/services.jar" classes.dex 2>/dev/null || true; cat "$out"/system/framework/oat/*/services.odex 2>/dev/null || true; } > "$dexbin"
            if grep -qa 'Turning the screenshot texture back' "$dexbin"; then
              fade="screen-off fix: found in the finished image (services)"
            else
              fade="screen-off fix: applied to the source, but not found in the finished image (it may just be stored in a form this check cannot read) - check the log"
              echo "::warning::screen-off fix: not found in the finished image"
            fi
            rm -f "$dexbin"
          fi
          launcher="launcher3: not applied (launcher3 was off)"
          if [ "$UA_LAUNCHER3" = "true" ]; then
            l3=$(find "$out/system/priv-app" "$out/system/app" -maxdepth 2 -name 'Launcher3.apk' -print -quit 2>/dev/null || true)
            l2=$(find "$out/system/priv-app" "$out/system/app" -maxdepth 2 -name 'Launcher2.apk' -print -quit 2>/dev/null || true)
            if [ -n "$l3" ] && [ -z "$l2" ]; then
              launcher="launcher3: found in the finished image (${l3#"$out"/}); Launcher2 is gone"
            else
              launcher="launcher3: applied to the source, but the finished image has Launcher3='${l3:-none}' and Launcher2='${l2:-none}' - check the log"
              echo "::warning::launcher3: unexpected launcher apps in the finished image"
            fi
          fi
          gpu="gpu_composition: not applied (gpu_composition was off)"
          if [ "$UA_GPUCOMP" = "true" ]; then
            if grep -q '^ro.sf.force_gles_composition=1$' "$out/system/build.prop" 2>/dev/null \
               && grep -qa 'ro.sf.force_gles_composition' "$out/system/lib/libsurfaceflinger.so" 2>/dev/null; then
              gpu="gpu_composition: found in the finished image (ro.sf.force_gles_composition=1 in build.prop, read by SurfaceFlinger)"
            else
              gpu="gpu_composition: applied to the source, but NOT everything was found in the finished image - check the log"
              echo "::warning::gpu_composition: not everything was found in the finished image"
            fi
          fi
          if [ -n "${ARTIFACT_PASSPHRASE:-}" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$n" -out "$n.enc" -pass env:ARTIFACT_PASSPHRASE
            rm -f "$n"
            echo "file=$n.enc" >> "$GITHUB_OUTPUT"
            how="Encrypted with your ARTIFACT_PASSPHRASE. Decrypt: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in $n.enc -out $n"
          else
            echo "file=$n" >> "$GITHUB_OUTPUT"
            how="NOT encrypted (no ARTIFACT_PASSPHRASE secret set). In a public repo anyone logged in to GitHub can download it."
          fi
          {
            echo "### Build finished: \`$n\` ($size)"
            echo ""
            echo "- md5: \`$(cut -d' ' -f1 "$n.md5")\`"
            echo "- sha256: \`$(cut -d' ' -f1 "$n.sha256")\`"
            echo "- $how"
            echo "- $portrait"
            echo "- $fade"
            echo "- $launcher"
            echo "- $gpu"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ROM zip
        id: upload_rom
        if: ${{ steps.collect.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: /ua/dist/${{ steps.collect.outputs.file }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      # Safety net: if the direct upload above is rejected, the ROM is uploaded again the classic (zipped) way,
      # because the runner is thrown away after this job and a finished build must not be lost on the last step.
      - name: Upload ROM zip (fallback)
        if: ${{ always() && steps.collect.outcome == 'success' && steps.upload_rom.outcome != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: rom
          path: /ua/dist/${{ steps.collect.outputs.file }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload checksums
        if: ${{ steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: |
            /ua/dist/*.md5
            /ua/dist/*.sha256
          retention-days: 14

      - name: Compress build log
        if: ${{ always() }}
        run: gzip -9 -f /ua/logs/*.log || true

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: /ua/logs/*.log.gz
          if-no-files-found: ignore
          retention-days: 14
